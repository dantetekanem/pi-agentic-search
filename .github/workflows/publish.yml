name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ github.event.release.tag_name != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: npm run check
      - run: npm run smoke
      - name: Use npm with Trusted Publishing support
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
      - run: npm stage publish . --provenance --access public
